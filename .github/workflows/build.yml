name: Build Lost Physics

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (contains LostPhysics.zip)
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Unpack project ZIP
        run: |
          set -e
          test -f LostPhysics.zip || { echo "LostPhysics.zip not found in repository root"; exit 1; }
          rm -rf project
          mkdir project
          unzip -q LostPhysics.zip -d project
          ls -la project

      - name: Locate project directory
        id: locate
        run: |
          set -e
          GRADLEW=$(find project -maxdepth 3 -name gradlew -type f | head -n 1)
          test -n "$GRADLEW" || { echo "gradlew not found inside the ZIP"; exit 1; }
          DIR=$(dirname "$GRADLEW")
          echo "Project directory: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Make gradlew executable
        working-directory: ${{ steps.locate.outputs.dir }}
        run: chmod +x gradlew

      - name: Build with Gradle
        working-directory: ${{ steps.locate.outputs.dir }}
        run: ./gradlew build --no-daemon --stacktrace

      - name: Verify JAR exists
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          ls -la build/libs
          ls build/libs/*.jar
          test -n "$(ls build/libs/*.jar 2>/dev/null)"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: LostPhysics-jar
          path: ${{ steps.locate.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
